apiVersion: v1
kind: Service
metadata:
  name: {{ include "todo-app.backendName" . }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
    {{- include "todo-app.selectorLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
  annotations:
    # Container-native load balancing (NEG) so the GKE Ingress can route straight to pods.
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: {{ dig "service" "type" "LoadBalancer" .Values.backend }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    {{- include "todo-app.selectorLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
