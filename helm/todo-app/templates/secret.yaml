{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-app.secretName" . }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  MYSQL_APP_PASSWORD: {{ required "secrets.mysqlAppPassword is required (or set secrets.existingSecret)" .Values.secrets.mysqlAppPassword | quote }}
  {{- if .Values.mysql.enabled }}
  MYSQL_ROOT_PASSWORD: {{ required "secrets.mysqlRootPassword is required when mysql.enabled=true (or set secrets.existingSecret)" .Values.secrets.mysqlRootPassword | quote }}
  {{- end }}
{{- end }}
