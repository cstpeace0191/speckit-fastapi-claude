apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "todo-app.backendName" . }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
    {{- include "todo-app.selectorLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "todo-app.selectorLabels" (dict "ctx" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "todo-app.selectorLabels" (dict "ctx" . "component" "backend") | nindent 8 }}
    spec:
      initContainers:
        # Wait until MySQL accepts TCP connections before starting the app
        # (equivalent of depends_on: condition: service_healthy in compose).
        - name: wait-for-mysql
          # Uses the mysql client shipped in the MySQL image (the backend image has no `python` on PATH).
          image: "{{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.tag }}"
          imagePullPolicy: {{ .Values.mysql.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              until mysqladmin ping -h "{{ include "todo-app.mysqlHost" . }}" -P 3306 --silent; do
                echo "waiting for MySQL at {{ include "todo-app.mysqlHost" . }}:3306"
                sleep 2
              done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.containerPort }}
              protocol: TCP
          env:
            - name: MYSQL_HOST
              value: {{ include "todo-app.mysqlHost" . | quote }}
            - name: MYSQL_USER
              value: {{ .Values.database.appUser | quote }}
            - name: MYSQL_DB
              value: {{ .Values.database.name | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "todo-app.secretName" . }}
                  key: MYSQL_APP_PASSWORD
          # /api/greeting does not touch the database, so the pod is not restarted
          # just because MySQL is briefly unavailable.
          readinessProbe:
            httpGet:
              path: /api/greeting
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/greeting
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
